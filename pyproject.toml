[project]
name = "agentconnect"
version = "0.4.0"
description = "AgentConnect - A framework for connecting and managing AI agents"
authors = [
    {name = "Akshat Joshi",email = "akkijoshi0511@gmail.com"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<4"
keywords = ["agents", "llm", "ai", "multi-agent", "artificial-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
]
urls = {Homepage = "https://github.com/AKKI0511/AgentConnect", Documentation = "https://AKKI0511.github.io/AgentConnect/"}
dependencies = [
    "python-dotenv (>=1.0.1,<2.0.0)",
    "typing-extensions (>=4.12.2,<5.0.0)",
    "cryptography (>=44.0.1,<51.0.0)",
    "pydantic (>=2.10.4,<3.0.0)",
    "pydantic-settings (>=2.7.1,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
]

[project.optional-dependencies]
serve = [
    "fastapi (>=0.115.8,<0.116.0) ; python_version < '3.14'",
    "fastapi (>=0.116.2,<0.117.0) ; python_version >= '3.14'",
    "uvicorn (>=0.34.0,<0.35.0)",
    "mcp[cli] (>=2.1.1,<3.0.0)",
]
mcp = [
    "mcp[cli] (>=2.1.1,<3.0.0)",
]
redis = [
    "redis[hiredis] (>=5.2.1,<6.0.0)",
]
aiagent = [
    "litellm (>=1.40.0,<3.0.0) ; python_version < '3.15'",
]
telegram = [
    "aiogram (>=3.19.0,<4.0.0) ; python_version < '3.15'",
    "litellm (>=1.40.0,<3.0.0) ; python_version < '3.15'",
]
embeddings = [
    "fastembed (>=0.7.0,<0.9.0)",
]
index = [
    "qdrant-client (>=1.14.2,<2.0.0)",
    "fastapi (>=0.115.8,<0.116.0) ; python_version < '3.14'",
    "fastapi (>=0.116.2,<0.117.0) ; python_version >= '3.14'",
    "uvicorn (>=0.34.0,<0.35.0)",
]
payments = [
    "cdp-sdk (>=0.21.0,<0.22.0)",
]
cli = [
    "typer (>=0.16.1,<0.17.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "aioconsole (>=0.8.1,<0.9.0)",
]
openai = [
    "tiktoken>=0.14.0,<1",
]

[project.scripts]
agentconnect = "agentconnect.cli:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
demo = [
    "websockets>=15.0,<16.0.0",
    "httpx>=0.28.1,<0.29.0",
    "python-multipart>=0.0.20,<0.0.21",
    "requests>=2.32.3,<3.0.0",
    "slowapi>=0.1.9,<0.2.0",
    "authlib>=1.4.1,<2.0.0",
    "fastapi>=0.115.8,<0.116.0; python_version < '3.14'",
    "fastapi>=0.116.2,<0.117.0; python_version >= '3.14'",
    "fastapi-limiter>=0.1.6,<0.2.0",
    "redis>=5.2.1,<6.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "aioredis>=2.0.1,<3.0.0",
    "psutil>=7.0.0,<8.0.0",
]

research = [
    "arxiv>=1.4.8,<2.0.0",
    "wikipedia>=1.4.0,<2.0.0",
    "tavily-python>=0.7.2,<0.8.0",
    "plotly>=6.0.1,<7.0.0",
    "matplotlib>=3.10.3,<4.0.0",
    "markdownify>=1.1.0,<2.0.0",
]

dev = [
    "pytest-asyncio>=0.26.0,<0.27.0",
    "pytest>=8.3.5,<9.0.0",
    "jsonschema>=4.23.0,<5.0.0",
]

docs = [
    "sphinx>=8.2.3,<9.0.0",
    "sphinx-rtd-theme>=3.0.2,<4.0.0",
    "sphinx-autodoc-typehints>=3.1.0,<4.0.0",
    "myst-parser>=4.0.1,<5.0.0",
    "sphinx-design>=0.6.1,<0.7.0",
    "sphinx-copybutton>=0.5.2,<0.6.0",
    "sphinx-markdown-builder>=0.6.8,<0.7.0",
    "pydata-sphinx-theme>=0.16.1,<0.17.0",
    "sphinx-togglebutton>=0.3.2,<0.4.0",
    # Keep the module-bearing release needed by the Sphinx 8 environment.
    "roman-numerals-py==3.1.0",
]

benchmark = [
    "pytest-benchmark==5.3.0",
    "psutil>=7.0.0,<8.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["agentconnect", "tests", "examples", "benchmarks"]
extend-exclude = [
    ".venv",
    "demos",
    "data",
    "downloads",
    "docs/source/api",
    "docs/build",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
markers = [
    "slow: Embedding/model-dependent tests. Skipped by default; run with -m slow",
    "redis: tests that need Redis; skipped locally unless reachable, required in CI",
    "perf: Runtime discovery benchmarks under benchmarks/runtime/",
]
addopts = ["-m", "not slow"]
filterwarnings = [
    "ignore:.*websockets\\.legacy is deprecated.*:DeprecationWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]
