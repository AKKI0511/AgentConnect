# Optional Python checks. uv resolves the latest stable Ruff release.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uvx ruff@latest check --force-exclude --fix
        language: system
        files: ^(agentconnect|tests|examples|benchmarks)/|^docs/generate_docs\.py$
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uvx ruff@latest format --force-exclude
        language: system
        files: ^(agentconnect|tests|examples|benchmarks)/|^docs/generate_docs\.py$
        types_or: [python, pyi]
