name: CI

on:
  pull_request:
  push:
    # Remove team-restructure after it merges into main.
    branches: [main, team-restructure]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Code and schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Lint and formatting
        run: |
          uvx ruff@latest check agentconnect tests examples docs/generate_docs.py
          uvx ruff@latest format --check agentconnect tests examples docs/generate_docs.py
      - name: Lockfiles and generated schema
        run: |
          uv lock --check
          uv lock --check --directory examples/quickstart
          uv lock --check --directory examples/recipes
          npm --prefix spec/schema ci
          npm --prefix spec/schema run check

  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        suite: [tests/]
        include:
          - os: windows-latest
            python: "3.12"
            suite: tests/imports/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra serve --extra cli --extra index --extra openai
      - run: uv run --no-sync pytest ${{ matrix.suite }} -q

  package:
    name: Distribution install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv build
      - name: Install wheel and sdist outside the checkout
        run: |
          set -euo pipefail
          for artifact in "$GITHUB_WORKSPACE"/dist/*.whl "$GITHUB_WORKSPACE"/dist/*.tar.gz; do
            work="$(mktemp -d "$RUNNER_TEMP/ac-package.XXXXXX")"
            uv venv "$work/venv"
            (
              cd "$work"
              uv pip install --python venv/bin/python "$artifact"
              venv/bin/python -c "from agentconnect.agent import BaseAgent; from agentconnect.team import Team"
              uv pip install --python venv/bin/python "$artifact[serve,cli]"
              venv/bin/python -c "from agentconnect.team.http import create_runtime_app; from agentconnect.mcp import create_team_mcp; from agentconnect.cli import app"
            )
          done

  ci:
    name: CI
    if: always()
    needs: [checks, tests, package]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ join(needs.*.result, ',') }}" = "success,success,success"
