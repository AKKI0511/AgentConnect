[pytest]
# Function-scoped loops match the Team Runtime fixtures.
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function

python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: Embedding/model-dependent tests. Skipped by default; run with -m slow
# Exclude slow tests by default. Run with: pytest -m slow
addopts = -m "not slow"
# Filter noisy third-party warnings that are not actionable in this repo
filterwarnings =
    ignore:.*websockets\.legacy is deprecated.*:DeprecationWarning
    ignore::pydantic.warnings.PydanticDeprecatedSince20
