name: CI

on:
  pull_request:
  push:
    # Remove team-restructure after it merges into main.
    branches: [main, team-restructure]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Code and schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Lint and formatting
        run: |
          uvx ruff@latest check agentconnect tests examples docs/generate_docs.py
          uvx ruff@latest format --check agentconnect tests examples docs/generate_docs.py
      - name: Lockfiles and generated schema
        run: |
          uv lock --check
          uv lock --check --directory examples/quickstart
          uv lock --check --directory examples/recipes
          npm --prefix spec/schema ci
          npm --prefix spec/schema run check

  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REDIS_URL: redis://127.0.0.1:6379/15
      AGENTCONNECT_REQUIRE_REDIS: "1"
      NO_PROXY: "127.0.0.1,localhost"
    services:
      redis:
        image: redis:8.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra serve --extra cli --extra index --extra openai --extra redis
      - name: Enable Redis DEBUG and AOF
        run: |
          uv run --no-sync python -c "import os, redis; c=redis.Redis.from_url(os.environ['REDIS_URL'], decode_responses=True); c.config_set('enable-debug-command','yes'); c.config_set('appendonly','yes')"
      - run: uv run --no-sync pytest tests/ -q

  windows-imports:
    name: Windows imports
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra serve --extra cli --extra index --extra openai
      - run: uv run --no-sync pytest tests/imports/ -q

  package:
    name: Distribution install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv build
      - name: Install wheel and sdist outside the checkout
        run: |
          set -euo pipefail
          for artifact in "$GITHUB_WORKSPACE"/dist/*.whl "$GITHUB_WORKSPACE"/dist/*.tar.gz; do
            work="$(mktemp -d "$RUNNER_TEMP/ac-package.XXXXXX")"
            uv venv "$work/venv"
            (
              cd "$work"
              uv pip install --python venv/bin/python "$artifact"
              venv/bin/python -c "from agentconnect.agent import BaseAgent; from agentconnect.team import Team"
              uv pip install --python venv/bin/python "$artifact[serve,cli]"
              venv/bin/python -c "from agentconnect.team.http import create_runtime_app; from agentconnect.mcp import create_team_mcp; from agentconnect.cli import app"
            )
          done

  ci:
    name: CI
    if: always()
    needs: [checks, tests, windows-imports, package]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ join(needs.*.result, ',') }}" = "success,success,success,success"
