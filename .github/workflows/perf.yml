name: Performance

on:
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-bench:
    name: Runtime discovery benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REDIS_URL: redis://127.0.0.1:6379/15
      AGENTCONNECT_REQUIRE_REDIS: "1"
      AGENTCONNECT_REQUIRE_NEURAL: "1"
      NO_PROXY: "127.0.0.1,localhost"
    services:
      redis:
        image: redis:8.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        command: >-
          redis-server --enable-debug-command yes --appendonly yes
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra serve --extra cli --extra embeddings --extra redis
      - name: Runtime benchmark
        run: uv run --no-sync python tests/m8/bench.py --require-neural --stress --out tests/m8/results/latest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m8-runtime-bench
          path: tests/m8/results/latest.json
