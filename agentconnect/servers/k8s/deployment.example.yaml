apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentconnect-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentconnect-registry
  template:
    metadata:
      labels:
        app: agentconnect-registry
    spec:
      containers:
        - name: registry
          image: agentconnect/registry-server:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: agentconnect-registry
            - secretRef:
                name: qdrant-secrets
