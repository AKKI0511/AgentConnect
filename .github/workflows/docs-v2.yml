name: Docs v2

# Mintlify / generated-API checks for docs-v2/. Validates only; it does
# not deploy.

on:
  pull_request:
    paths:
      - "docs-v2/**"
      - "agentconnect/**"
      - ".github/workflows/docs-v2.yml"
  push:
    branches: [main, team-restructure]
    paths:
      - "docs-v2/**"
      - "agentconnect/**"
      - ".github/workflows/docs-v2.yml"
  workflow_dispatch:

concurrency:
  group: docs-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-v2:
    name: Mintlify and API reference
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: docs-v2/package-lock.json

      - parallel:
          - name: Sync Python docs tooling
            run: uv sync --locked --directory docs-v2
          - name: Sync Node docs tooling
            run: npm ci --prefix docs-v2

      - name: Docs-v2 checks
        working-directory: docs-v2
        run: npm run check
