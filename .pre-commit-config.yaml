# Ruff owns lint/formatting; mypy uses the locked project environment.
repos:
  - repo: local
    hooks:
      - id: mypy
        name: Framework types
        entry: uv run --locked --all-extras mypy
        language: system
        pass_filenames: false
        files: ^agentconnect/.*\.(py|pyi)$|^tests/typing/.*\.(py|pyi)$|^pyproject\.toml$|^uv\.lock$|^\.pre-commit-config\.yaml$|^\.github/workflows/main\.yml$
      - id: ruff-check
        name: Ruff check
        entry: uvx ruff@latest check --force-exclude --fix
        language: system
        files: ^(agentconnect|tests|examples|experiments|benchmarks)/
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uvx ruff@latest format --force-exclude
        language: system
        files: ^(agentconnect|tests|examples|experiments|benchmarks)/
        types_or: [python, pyi]
