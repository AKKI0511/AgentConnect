name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "agentconnect/**"
      - "docs/**"
      - "pyproject.toml"
      - "uv.lock"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: |
          uv sync --locked --group docs --extra serve --extra cli
      - name: Build website and API reference
        run: uv run --no-sync python docs/generate_docs.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/html

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
