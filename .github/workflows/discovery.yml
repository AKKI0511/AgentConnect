name: Discovery quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agentconnect/**"
      - "benchmarks/discovery/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/**"
  push:
    branches: [main, team-restructure]
    paths:
      - "agentconnect/**"
      - "benchmarks/discovery/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/**"

concurrency:
  group: discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discovery-quality:
    name: Discovery quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENTCONNECT_REQUIRE_NEURAL: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - name: Install embeddings extra
        run: uv sync --locked --extra embeddings
      - name: Corpus shape
        run: uv run --no-sync python -m benchmarks.discovery.check
      - name: Rank held-out needs
        run: uv run --no-sync python -m benchmarks.discovery.score
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: discovery-quality
          path: benchmarks/discovery/artifacts/discovery-v1/
