[project]
name = "agentconnect"
version = "0.4.0"
description = "A messaging runtime for teams of independent AI agents"
authors = [
    {name = "Akshat Joshi",email = "akkijoshi0511@gmail.com"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<4"
keywords = ["agents", "llm", "ai", "multi-agent", "artificial-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
]
urls = {Homepage = "https://github.com/AKKI0511/AgentConnect", Documentation = "https://github.com/AKKI0511/AgentConnect/tree/main/docs-v2"}
dependencies = [
    "typing-extensions>=4.16.0,<5",
    "cryptography>=44.0.1,<51",
    "pydantic>=2.13.5,<2.14",
    "pydantic-settings>=2.16.0,<3",
    "httpx>=0.28.1,<0.29",
    "tomli-w>=1.2.0,<2",
    "fastapi>=0.143.3,<1",
    "uvicorn>=0.54.0,<1",
    "mcp>=2.3.0,<3",
    "typer>=0.27.3,<1",
]

[project.optional-dependencies]
redis = [
    "redis[hiredis]>=8.1.0,<9",
]
embeddings = [
    "fastembed>=0.7.0,<0.9.0",
    "tiktoken>=0.14.0,<1",
]
prebuilt = [
    "aioconsole>=0.8.2,<1",
    "aiogram>=3.31.0,<4 ; python_full_version < '3.15'",
    "litellm>=1.105.1,<3 ; python_full_version < '3.15'",
    "python-dotenv>=1.2.4,<2",
]

[project.scripts]
agentconnect = "agentconnect.cli.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "agentconnect"}]
include = [
    {path = "agentconnect/py.typed", format = ["sdist", "wheel"]},
    {path = "agentconnect/config/agentconnect.example.toml", format = ["sdist", "wheel"]},
]
exclude = [
    "req",
    "internal",
    "experiments/**/reports",
    "**/.env",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest-asyncio>=1.4.0,<2",
    "pytest>=9.1.1,<10",
    "jsonschema>=4.26.0,<5",
]

benchmark = [
    "pytest-benchmark==5.3.0",
    "psutil>=7.2.2,<8",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
files = ["agentconnect", "tests/typing"]
strict = true
follow_imports = "normal"
# Discover the whole framework. Canonical models describe public boundaries;
# reflection, vendor SDKs and persistence codecs may retain dynamic values.

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["agentconnect", "tests", "examples", "experiments", "benchmarks"]
extend-exclude = [
    ".venv",
    "data",
    "downloads",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
markers = [
    "slow: Embedding/model-dependent tests. Skipped by default; run with -m slow",
    "redis: tests that need Redis; skipped locally unless reachable, required in CI",
    "perf: Runtime benchmarks under benchmarks/runtime/",
]
addopts = ["-m", "not slow"]
filterwarnings = [
    "ignore:.*websockets\\.legacy is deprecated.*:DeprecationWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]
