[project]
name = "agentconnect-quickstart"
version = "0.0.0"
description = "Run a small AgentConnect team with uv."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "agentconnect",
    "openai>=1.40.0,<3",
    "python-dotenv>=1.0.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["team_demo"]

[project.scripts]
team-demo = "team_demo.__main__:main"

[tool.uv.sources]
agentconnect = { path = "../../", editable = true }
