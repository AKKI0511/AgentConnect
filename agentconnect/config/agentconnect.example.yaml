# Describes a Team and the Agents this process hosts.
# Embedded Team("name").start() needs no file.
# Secrets stay in the environment.
#
# store: memory  or  redis://localhost:6379/0
# embeddings: auto | none | fastembed | litellm:<model>
#
# Agents listed here are constructed by `agentconnect up`.
# Agents in other processes join by URL with a token from
# `agentconnect token issue`.

team: content-squad
store: memory
embeddings: auto
host: 127.0.0.1
port: 9000
require_join_auth: true
agents:
- class: agents.researcher:Researcher
  name: researcher
- class: agents.writer:Writer
  name: writer
tools:
- tools.docs:search_our_docs
