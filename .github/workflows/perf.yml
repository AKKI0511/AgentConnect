name: Performance

on:
  workflow_dispatch:
    inputs:
      stress:
        description: "Run the optional 10,000-member hashed stress probe"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - "agentconnect/**"
      - "benchmarks/runtime/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/**"
  push:
    branches: [main, team-restructure]
    paths:
      - "agentconnect/**"
      - "benchmarks/runtime/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/**"

concurrency:
  group: perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-bench:
    name: Runtime benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REDIS_URL: redis://127.0.0.1:6379/15
      AGENTCONNECT_REQUIRE_REDIS: "1"
      AGENTCONNECT_REQUIRE_NEURAL: "1"
      AGENTCONNECT_STRESS_BENCH: ${{ github.event_name == 'workflow_dispatch' && inputs.stress && '1' || '' }}
      NO_PROXY: "127.0.0.1,localhost"
    services:
      redis:
        image: redis:8.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        command: redis-server --enable-debug-command yes --appendonly yes
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      # Benchmark groups stay sequential: they compete for CPU and Redis.
      - id: dependencies
        run: uv sync --locked --group benchmark --extra embeddings --extra redis
      - name: Create result directory
        run: mkdir -p benchmarks/runtime/results
      - name: Cold, Profile update, fallback
        run: >
          uv run --no-sync pytest -q --benchmark-warmup=off
          benchmarks/runtime/test_phases.py
          --benchmark-json=benchmarks/runtime/results/phases.json
          --junitxml=benchmarks/runtime/results/phases.xml
      - name: Hashed warm find
        run: >
          uv run --no-sync pytest -q --benchmark-warmup=off
          benchmarks/runtime/test_warm_find.py
          --benchmark-json=benchmarks/runtime/results/warm.json
          --junitxml=benchmarks/runtime/results/warm.xml
      - name: Overlap send, renew, expiry
        run: >
          uv run --no-sync pytest -q --benchmark-warmup=off
          benchmarks/runtime/test_overlap.py
          --benchmark-json=benchmarks/runtime/results/overlap.json
          --junitxml=benchmarks/runtime/results/overlap.xml
      - name: Neural FastEmbed
        run: >
          uv run --no-sync pytest -q --benchmark-warmup=off
          benchmarks/runtime/test_neural.py
          --benchmark-json=benchmarks/runtime/results/neural.json
          --junitxml=benchmarks/runtime/results/neural.xml
      - name: Hashed stress
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.stress }}
        run: >
          uv run --no-sync pytest -q --benchmark-warmup=off
          benchmarks/runtime/test_stress.py
          --benchmark-json=benchmarks/runtime/results/stress.json
          --junitxml=benchmarks/runtime/results/stress.xml
      - name: Request/reply exchange
        run: >
          uv run --no-sync pytest -q --benchmark-warmup=off
          benchmarks/runtime/request_reply
          --benchmark-json=benchmarks/runtime/results/exchange.json
          --junitxml=benchmarks/runtime/results/exchange.xml
      - name: Public SDK collaboration
        run: >
          uv run --no-sync pytest -q --benchmark-warmup=off
          benchmarks/runtime/public_sdk
          --benchmark-json=benchmarks/runtime/results/collaboration.json
          --junitxml=benchmarks/runtime/results/collaboration.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime-bench
          path: benchmarks/runtime/results/
