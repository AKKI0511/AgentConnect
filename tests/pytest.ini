[pytest]
# Function-scoped loops match the Team Runtime fixtures.
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function

python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: Embedding/model-dependent tests. Skipped by default; run with -m slow
    redis: tests that need Redis; skipped locally unless reachable, required in CI
    perf: longer M8 benchmarks. Skipped by default; run with -m perf
# Exclude slow and perf tests by default. Redis tests still run (skip/fail by server).
addopts = -m "not slow and not perf"
# Filter noisy third-party warnings that are not actionable in this repo
filterwarnings =
    ignore:.*websockets\.legacy is deprecated.*:DeprecationWarning
    ignore::pydantic.warnings.PydanticDeprecatedSince20
